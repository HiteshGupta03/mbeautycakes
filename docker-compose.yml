services:

  # =========================================
  # MYSQL DATABASE
  # =========================================

  mysql:
    image: mysql:8.0

    container_name: mbeautycakes-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mbeautycakes

    volumes:
      - mysql-data:/var/lib/mysql

      # Initialize schema when database is created
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # =========================================
  # BACKEND
  # =========================================

  backend:
    build:
      context: ./backend
    image: hit22/mbeautycakes-backend:v1.0.0
    container_name: mbeautycakes-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: mbeautycakes

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # =========================================
  # FRONTEND + NGINX
  # =========================================

  frontend:
    build:
      context: ./frontend
    image: hit22/mbeautycakes-frontend:v1.0.0
    container_name: mbeautycakes-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


# =========================================
# PERSISTENT MYSQL VOLUME
# =========================================

volumes:

  mysql-data:
    name: mbeautycakes_mysql_data